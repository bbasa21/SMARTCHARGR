name: LSPosed SystemUI Probe APK

on:
  push:
    branches:
      - feature/lsposed-systemui-diagnostics
    paths:
      - 'lsposed-module/**'
      - '.github/workflows/lsposed-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build diagnostic module
        working-directory: lsposed-module
        run: gradle --no-daemon assembleDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: SMARTCHARGR-SystemUI-Probe-debug
          path: lsposed-module/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
